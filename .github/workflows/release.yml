name: Release Build (Linux & Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "İsteğe bağlı Release etiketi (ör. v2.10.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test-and-build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Qt & packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg libxcb-cursor0 libegl1 libxkbcommon-x11-0

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pytest "pyinstaller>=6"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -m pytest tests -q

      - name: Build Linux packages (.tar.gz, .deb, .rpm)
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh --all

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  test-and-build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest "pyinstaller>=6"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: Build Windows Portable & Setup EXE
        shell: cmd
        run: |
          for /f "delims=" %%V in ('python -c "from core import version; print(version.VERSION)"') do set "APPVER=%%V"
          set "PI_EXCLUDES=--exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.Qt3DCore --exclude-module PySide6.Qt3DRender --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml --exclude-module PySide6.QtMultimedia --exclude-module PySide6.QtCharts --exclude-module PySide6.QtDataVisualization --exclude-module tkinter"
          set "PI_HIDDEN=--hidden-import core.gutter_engine --hidden-import core.pdf_tools --hidden-import core.page_layout_model --hidden-import core.settings_store --hidden-import core.diagnostics --hidden-import core.version"
          python -m PyInstaller --noconfirm --clean --noconsole --onedir %PI_EXCLUDES% %PI_HIDDEN% --add-data "assets;assets" --add-data "locales;locales" --icon "assets\icon.ico" --name "PDF_Baski_Atolyesi" app.py
          python -m PyInstaller --noconfirm --noconsole --onefile %PI_EXCLUDES% %PI_HIDDEN% --add-data "assets;assets" --add-data "locales;locales" --icon "assets\icon.ico" --name "PDF_Baski_Atolyesi_%APPVER%_Portable" app.py
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=%APPVER% "packaging\windows\installer.iss"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*_Portable.exe
            dist/*_Setup.exe

  publish-release:
    needs: [test-and-build-linux, test-and-build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/linux-packages/*
            artifacts/windows-packages/*
